<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Deep Futuristic Space Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="40%" stop-color="#091e3a" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>

    <!-- Glowing Cyan/Teal Gradient -->
    <linearGradient id="neonTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Golden Intellect Accent -->
    <linearGradient id="goldIntellect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Electric Purple & Sky Gradient -->
    <linearGradient id="purpleSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Squircle Frame -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Neon Border Ring -->
  <rect
    x="6"
    y="6"
    width="500"
    height="500"
    rx="114"
    fill="none"
    stroke="url(#neonTeal)"
    stroke-width="4.5"
    opacity="0.75"
  />

  <!-- Subtle Radial Ambient Light Behind Core -->
  <circle cx="256" cy="240" r="150" fill="#0284c7" opacity="0.15" filter="url(#intenseGlow)" />
  <circle cx="256" cy="220" r="90" fill="#2dd4bf" opacity="0.22" filter="url(#intenseGlow)" />

  <!-- Geometric Tech Orbit Circles -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.7" />
  <circle cx="256" cy="240" r="125" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.35" />

  <!-- Neural Constellation Spark Nodes -->
  <circle cx="160" cy="155" r="4" fill="#38bdf8" filter="url(#softGlow)" />
  <circle cx="352" cy="155" r="4" fill="#38bdf8" filter="url(#softGlow)" />
  <line x1="160" y1="155" x2="200" y2="185" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />
  <line x1="352" y1="155" x2="312" y2="185" stroke="#38bdf8" stroke-width="1.5" opacity="0.4" />

  <!-- Core Element 1: 3D Open Knowledge Book (Wings of Wisdom) -->
  <g transform="translate(256, 340)">
    <!-- Book Shadow -->
    <path d="M -160,15 C -80,-5 0,15 0,15 C 0,15 80,-5 160,15 L 150,75 C 75,55 0,72 0,72 C 0,72 -75,55 -150,75 Z" fill="#000000" opacity="0.5" />

    <!-- Left Page Wing -->
    <path
      d="M 0,10 C -50,-18 -125,-16 -165,8 L -165,72 C -125,50 -50,48 0,76 Z"
      fill="url(#neonTeal)"
      filter="url(#softGlow)"
    />

    <!-- Right Page Wing (RTL Primary Accent) -->
    <path
      d="M 0,10 C 50,-18 125,-16 165,8 L 165,72 C 125,50 50,48 0,76 Z"
      fill="url(#purpleSky)"
      filter="url(#softGlow)"
    />

    <!-- Book Spine Glow Center Line -->
    <path d="M -4,6 L 0,0 L 4,6 L 4,82 L 0,76 L -4,82 Z" fill="#f8fafc" />

    <!-- Page Decorative Data Tracks -->
    <path d="M -30,22 C -70,5 -115,8 -140,24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M -30,42 C -70,25 -115,28 -140,44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
    <path d="M 30,22 C 70,5 115,8 140,24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <path d="M 30,42 C 70,25 115,28 140,44" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- Core Element 2: Graduation Cap of Excellence + Glowing AI Diamond -->
  <g transform="translate(256, 195)">
    <!-- Cap Rhombus (Graduation Mortarboard) -->
    <polygon
      points="0,-65 95,-22 0,20 -95,-22"
      fill="#0f172a"
      stroke="url(#goldIntellect)"
      stroke-width="5"
      filter="url(#softGlow)"
    />

    <!-- Inner Mortarboard Inset -->
    <polygon
      points="0,-52 75,-18 0,14 -75,-18"
      fill="url(#bgGrad)"
      stroke="#38bdf8"
      stroke-width="1.8"
      opacity="0.8"
    />

    <!-- Graduation Cap Skull Base -->
    <path
      d="M -50,-2 C -50,28 50,28 50,-2 L 50,15 C 50,45 -50,45 -50,15 Z"
      fill="#091e3a"
      stroke="url(#goldIntellect)"
      stroke-width="3.5"
    />

    <!-- Golden Tassel & Hanging Cord -->
    <circle cx="0" cy="-22" r="6" fill="#fef08a" />
    <path
      d="M 0,-22 C 45,-20 82,-5 86,25"
      fill="none"
      stroke="url(#goldIntellect)"
      stroke-width="3.5"
      stroke-linecap="round"
    />
    <polygon points="82,25 90,25 88,48 84,48" fill="url(#goldIntellect)" />

    <!-- Center Radiant AI Diamond Crystal -->
    <polygon
      points="0,-35 22,-22 0,-9 -22,-22"
      fill="url(#neonTeal)"
      filter="url(#intenseGlow)"
    />
  </g>

  <!-- Top Corona Rays of Enlightenment -->
  <g transform="translate(256, 95)">
    <line x1="0" y1="0" x2="0" y2="-18" stroke="#fef08a" stroke-width="4.5" stroke-linecap="round" filter="url(#softGlow)" />
    <line x1="-32" y1="6" x2="-45" y2="-8" stroke="#fef08a" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <line x1="32" y1="6" x2="45" y2="-8" stroke="#fef08a" stroke-width="4" stroke-linecap="round" opacity="0.85" />
    <line x1="-60" y1="22" x2="-76" y2="12" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.6" />
    <line x1="60" y1="22" x2="76" y2="12" stroke="#fef08a" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  </g>

  <!-- Four Point Sparkle Stars -->
  <g transform="translate(105, 110)">
    <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="#38bdf8" filter="url(#softGlow)" />
  </g>
  <g transform="translate(405, 110)">
    <polygon points="0,-16 3,-3 16,0 3,3 0,16 -3,3 -16,0 -3,-3" fill="#2dd4bf" filter="url(#softGlow)" />
  </g>
  <g transform="translate(425, 310)">
    <polygon points="0,-12 2,-2 12,0 2,2 0,12 -2,2 -12,0 -2,-2" fill="#fef08a" opacity="0.8" />
  </g>
  <g transform="translate(85, 310)">
    <polygon points="0,-12 2,-2 12,0 2,2 0,12 -2,2 -12,0 -2,-2" fill="#38bdf8" opacity="0.8" />
  </g>
</svg>

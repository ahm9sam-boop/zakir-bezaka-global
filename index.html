    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "ذاكر بذكاء - Zakir Smart",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web, Android, iOS",
        "description": "AI-powered study platform with lecture transcription, summarization, PDF reader, quizzes, flashcards, mind maps, and study timer.",
        "inLanguage": ["ar", "en", "fr", "es", "de", "tr", "pt", "id", "hi", "ru"],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <script>
      // Prevent flash of wrong theme or direction before React hydrates
      (function () {
        try {
          var rawTheme = localStorage.getItem('zakir_theme');
          var theme = rawTheme ? JSON.parse(rawTheme) : 'dark';
          var root = document.documentElement;
          if (theme === 'light') {
            root.classList.remove('dark');
          } else {
            root.classList.add('dark');
          }
          var rawLang = localStorage.getItem('zakir_language');
          var lang = rawLang ? JSON.parse(rawLang) : (navigator.language || 'en').slice(0, 2);
          root.lang = lang;
          root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
    <script src="/pdf.min.js"></script>
    <script>
      (function () {
        function setupWorker() {
          if (window.pdfjsLib) {
            try {
              window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdf.worker.min.js';
            } catch (e) {
              console.warn('PDF.js worker setup:', e);
            }
          }
        }
        if (!window.pdfjsLib) {
          var s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
          s.onload = setupWorker;
          document.head.appendChild(s);
        } else {
          setupWorker();
        }
      })();
    </script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased selection:bg-teal-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

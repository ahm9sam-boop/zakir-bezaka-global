name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Install
        run: |
          npm install --legacy-peer-deps
          npm install --save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
      - name: Build web
        run: npm run build
      - name: Add Android
        run: |
          npx cap add android
          npx cap sync android
          grep -q LocalNotifications android/app/src/main/assets/capacitor.plugins.json || (echo 'LocalNotifications plugin missing' && exit 1)
          M=android/app/src/main/AndroidManifest.xml
          for P in POST_NOTIFICATIONS SCHEDULE_EXACT_ALARM RECEIVE_BOOT_COMPLETED VIBRATE; do grep -q "android.permission.$P" $M || sed -i "s#<application#<uses-permission android:name=\"android.permission.$P\" />\n    <application#" $M; done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp public/pwa-192x192.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp public/pwa-192x192.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            rm -f android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
          VER="${{ github.event.inputs.version }}"
          sed -i "s#ZakirApp/[0-9.]*#ZakirApp/$VER#" capacitor.config.json android/app/src/main/assets/capacitor.config.json 2>/dev/null || true
          CODE=$(echo "$VER" | awk -F. '{print $1*10000+$2*100+$3}')
          sed -i "s/versionCode 1/versionCode $CODE/; s/versionName \"1.0\"/versionName \"$VER\"/" android/app/build.gradle
      - name: Build release APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > ks.jks
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -p -f 4 "$UNSIGNED" aligned.apk
          $BT/apksigner sign --ks ks.jks --ks-key-alias zakir --ks-pass env:KS_PASS --key-pass env:KS_PASS --out zakir-smart.apk aligned.apk
          $BT/apksigner verify zakir-smart.apk
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ github.event.inputs.version }}"
          gh release create "$TAG" zakir-smart.apk --title "Zakir Smart $TAG" --notes "Android app $TAG" || gh release upload "$TAG" zakir-smart.apk --clobber
